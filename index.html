
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscripción Estudiantil</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <main class="contenedor">
        <header class="encabezado">
            <div class="icono">🎓</div>
            <h1>Inscripción Estudiantil</h1>
            <p>Completa tus datos para registrarte</p>
        </header>

        <form id="formulario" action="#" method="post" autocomplete="on">

            <fieldset>
                <legend>Datos personales</legend>

                <div class="campo">
                    <label for="nombre">Nombre completo</label>
                    <input type="text" id="nombre" name="nombre"
                           placeholder="Tu nombre completo" required minlength="3">
                </div>

                <div class="campo">
                    <label for="edad">Edad</label>
                    <input type="number" id="edad" name="edad"
                           placeholder="Tu edad" min="10" max="100" step="1" required>
                </div>

                <div class="campo">
                    <label for="correo">Correo electrónico</label>
                    <input type="email" id="correo" name="correo"
                           placeholder="ejemplo@gmail.com" required>
                </div>

                <div class="campo">
                    <label for="fecha">Fecha de nacimiento</label>
                    <input type="date" id="fecha" name="fecha" required>
                </div>

                <div class="campo">
                    <label for="clave">Contraseña</label>
                    <input type="password" id="clave" name="clave"
                           placeholder="Mínimo 6 caracteres"
                           minlength="6" required>
                </div>
            </fieldset>

            <fieldset>
                <legend>Información académica</legend>

                <div class="campo">
                    <label for="curso">Curso</label>
                    <select id="curso" name="curso" required>
                        <option value="">Selecciona tu curso</option>
                        <option value="4to">4to</option>
                        <option value="5to">5to</option>
                        <option value="6to">6to</option>
                    </select>
                </div>

                <div class="campo">
                    <span class="titulo-campo">Turno</span>
                    <div class="opciones">
                        <label class="opcion">
                            <input type="radio" name="turno"
                                   value="Mañana" required>
                            Mañana
                        </label>
                        <label class="opcion">
                            <input type="radio" name="turno" value="Tarde">
                            Tarde
                        </label>
                    </div>
                </div>

                <div class="campo">
                    <span class="titulo-campo">Áreas de interés</span>
                    <div class="opciones">
                        <label class="opcion">
                            <input type="checkbox" name="intereses"
                                   value="Programación">
                            Programación
                        </label>
                        <label class="opcion">
                            <input type="checkbox" name="intereses"
                                   value="Redes">
                            Redes
                        </label>
                        <label class="opcion">
                            <input type="checkbox" name="intereses"
                                   value="Reparación">
                            Reparación de equipos
                        </label>
                    </div>
                </div>

                <div class="campo">
                    <label for="comentario">¿Por qué elegiste esta área?</label>
                    <textarea id="comentario" name="comentario"
                              rows="4" maxlength="300"
                              placeholder="Escribe tu respuesta..."></textarea>
                </div>

                <div class="campo">
                    <label for="documento">Documento (opcional)</label>
                    <input type="file" id="documento" name="documento"
                           accept=".pdf,.jpg,.jpeg,.png">
                    <small>Formatos permitidos: PDF, JPG y PNG.</small>
                </div>
            </fieldset>

            <label class="aceptacion">
                <input type="checkbox" id="aceptar" required>
                Confirmo que los datos son correctos.
            </label>

            <div class="botones">
                <button type="submit" class="btn-enviar">
                    Enviar formulario
                </button>
                <button type="reset" class="btn-limpiar">
                    Limpiar
                </button>
            </div>

            <p id="mensaje" role="status" aria-live="polite"></p>

        </form>

        <footer>
            Proyecto educativo de formularios HTML
        </footer>
    </main>

</body>
</html>
